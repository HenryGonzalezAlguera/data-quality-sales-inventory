name: Python Data Quality CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: "0"
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Generar fuentes sintéticas de forma reproducible
        run: python src/generar_datos.py

      - name: Ejecutar notebook completo (reconstruye resultados y Excel)
        run: |
          python -m jupyter nbconvert \
            --to notebook --execute notebooks/01_auditoria_calidad_datos.ipynb \
            --output /tmp/01_auditoria_calidad_datos_ejecutado.ipynb \
            --ExecutePreprocessor.timeout=300

      - name: Validar indicadores y calidad de entregables
        run: python -m src.validar_entregables

      - name: Ejecutar pruebas de regresión
        run: python -m pytest -q tests/
